name: Submit an agent
description: Submit a live, self-describing agent to the GA4GH AI Registry
title: "[Agent] "
labels: ["registry-submission", "type:agent"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting an agent to the GA4GH AI Registry. Automation will check this form's
        contents (schema conformance, licence eligibility, link resolution, live Agent Info
        endpoint conformance) and comment back with any errors; a maintainer then decides whether
        the entry belongs in the catalogue. See `internal project documentation` Section 5.4 for the full review
        process.

        **Field conventions used throughout this form:**
        - A comma-separated field takes multiple values on one line, e.g. `trs, drs`.
        - A multi-line field takes one row per item, each row itself comma-separated in the exact
          column order stated in that field's own description.
        - A "paste JSON" field takes the exact JSON object you already have (in this form, the raw
          response body of your agent's own live endpoint), not individually re-typed fields.

  - type: input
    id: id
    attributes:
      label: Registry slug (id)
      description: Lowercase letters, digits, and hyphens only, e.g. "variant-triage-agent". Must be unique among agent entries.
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Display name
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: One-line summary
      description: Maximum 200 characters.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Markdown. Rendered on the entry's detail page.
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: Homepage URL
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Source repository URL
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: Licence
      description: Choose "other" if your licence is not listed, and fill in the licence URL field below.
      options:
        - Apache-2.0
        - MIT
        - BSD-2-Clause
        - BSD-3-Clause
        - ISC
        - GPL-2.0-only
        - GPL-3.0-only
        - LGPL-2.1-only
        - LGPL-3.0-only
        - AGPL-3.0-only
        - MPL-2.0
        - CC0-1.0
        - CC-BY-4.0
        - CC-BY-SA-4.0
        - CC-BY-NC-4.0
        - Unlicense
        - OFL-1.1
        - other
    validations:
      required: true

  - type: input
    id: license_url
    attributes:
      label: Licence URL (required only if licence is "other")

  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true

  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: "Comma-separated, e.g.: variant-triage, clinical-genomics"

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - variant-interpretation
        - literature-curation
        - clinical-decision-support
        - data-access-governance
        - research-assistant
        - workflow-orchestration
        - regulatory-compliance
        - other
    validations:
      required: true

  - type: input
    id: ga4gh_standards
    attributes:
      label: GA4GH standards touched (optional)
      description: "Comma-separated, e.g.: trs, drs."

  - type: textarea
    id: maintainers
    attributes:
      label: Maintainers
      description: "One per line: name, github-username[, affiliation[, orcid]]. At least one row required."
      placeholder: Grace Hopper, grace-hopper
    validations:
      required: true

  - type: textarea
    id: safety_classification
    attributes:
      label: Safety classification (optional)
      description: >
        One per line: scheme, level, source[, certifying_body[, evaluation_date[, valid_until[, evidence_uri]]]].
        scheme is "ga4gh-gase" or "ga4gh-agent-runtime-risk"; source is "submitter-attested", "maintainer-verified", or
        "synced-from-endpoint". This is usually populated automatically from agent_info_snapshot.enrichment.gasl_level
        below; leave blank unless you also hold a separate GASE classification.

  - type: input
    id: agent_info_uri
    attributes:
      label: Agent Info endpoint URI
      description: The agent's live {agent_base_url}/service-info endpoint.
    validations:
      required: true

  - type: input
    id: alignment_card_uri
    attributes:
      label: Alignment card URI (optional)

  - type: textarea
    id: agent_info_snapshot
    attributes:
      label: agent_info_snapshot block
      description: >
        Paste the relevant portion of your agent's live /service-info response as JSON: at minimum
        {"protocol_version": "...", "agent_type": "...", "trust_level": "...", "enrichment": {"gasl_level": <0-4>}}.
        See internal project documentation Section 3.5.2 for the full field list (auo_capabilities, guardrails_enabled,
        delegation_support, dependencies, trace_endpoint, audit_retention_days, and enrichment's
        trust_score/trust_tier/last_audit_date/dependency_count/guardrail_coverage are all optional).
      render: json
      placeholder: |
        {
          "protocol_version": "0.5.0",
          "agent_type": "variant-triage",
          "trust_level": "registered",
          "enrichment": { "gasl_level": 2 }
        }
    validations:
      required: true
