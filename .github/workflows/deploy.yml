name: Deploy

# Builds the site and every machine-readable projection on push to main, and
# deploys the combined output to GitHub Pages (internal project documentation Section 5,
# Section 6). `concurrency` matches GitHub's own documented pattern for
# Pages deployments: a second push while one deploy is still running queues
# rather than races it.
#
# History (2026-09-08 to 2026-09-11, internal project documentation Phase 12 addendum): this
# workflow briefly ran as a build/validate-only CI check while this
# repository's GitHub remote was private (GitHub Pages requires a public
# repository on the Free plan) and GitLab Pages carried the live site
# instead. The person running that session decided to make this GitHub
# repository public and use GitHub Pages as the canonical deploy target
# after all, with GitLab kept as a private full-content mirror of this
# repository's local `main` branch (not the published one) -- see
# internal project documentation for the current split. This workflow's `deploy` job is
# restored accordingly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit `version:` input: pnpm/action-setup@v4 reads the pinned
      # version straight from package.json's `packageManager` field instead.
      # A hard-coded version here previously conflicted with that field
      # (`packageManager: "pnpm@11.7.0"` vs. this step's own `version: 9`),
      # which pnpm/action-setup refuses to run past at all -- confirmed as a
      # real CI failure on this project's first-ever GitHub Actions run
      # (internal project documentation Phase 9), not a hypothetical.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --skip-network (2026-09-08, internal project documentation Phase 12 addendum): the
      # 18 pre-existing ga4gh-* entries per type (skills/mcp-servers/plugins,
      # 54 checks total) reference github.com/susheel/ga4gh-plugins, kept
      # deliberately private (internal project documentation Phase 9) -- GitHub returns 404 to
      # an unauthenticated reachability check against a private repo,
      # permanently, not transiently. Without this flag the deploy gate would
      # fail on every single run forever, for a reason unrelated to entry
      # correctness. Schema, licence, category, and slug-collision checks
      # still run and still fail the deploy; only live URL reachability is
      # skipped here. `pnpm run check-bundle-freshness` and this repository's
      # `bundle-freshness.yml` still exercise the network checks that matter
      # (bundle source drift) on their own schedule.
      - name: Validate every entry (fail the deploy, not just warn, on a bad entry)
        run: pnpm run validate -- --skip-network

      - name: Build the site (Astro + Pagefind)
        run: pnpm --filter site build

      - name: Build and embed the machine-readable projections (internal project documentation Section 7)
        run: |
          pnpm run build:index -- --out-dir site/dist
          pnpm run build:ai-catalog -- --out-dir site/dist
          pnpm run build:mcp-docs -- --out-dir site/dist
          pnpm run build:marketplace -- --out-dir site/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
