name: Validate submission

# Workflow 1 (internal project documentation Section 6): parses a submission issue, runs the
# same checks `pnpm validate` runs against the candidate record it builds,
# and comments the result back on the issue. This gate MUST NOT write
# anything to the repository -- it only comments and labels.
#
# Every value parsed from the issue body is passed through `env:`, never
# interpolated into a `run:` string, per GitHub's script-injection hardening
# guidance (internal project documentation Section 6). `ISSUE_FIELDS_JSON` in particular is
# attacker-controllable free text and is read only via `process.env` inside
# scripts/validate-submission.ts, never inlined into a shell command.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'registry-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine submission type from labels
        id: type
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((l) => l.name);
            const typeLabel = labels.find((l) => l.startsWith('type:'));
            if (!typeLabel) {
              core.setFailed('No type:<kind> label found on this issue; the issue form should have applied one automatically.');
              return;
            }
            core.setOutput('type', typeLabel.slice('type:'.length));

      - name: Select this type's issue-form template path
        id: template
        env:
          TYPE: ${{ steps.type.outputs.type }}
        run: |
          case "$TYPE" in
            model) echo "path=.github/ISSUE_TEMPLATE/submit-model.yml" >> "$GITHUB_OUTPUT" ;;
            agent) echo "path=.github/ISSUE_TEMPLATE/submit-agent.yml" >> "$GITHUB_OUTPUT" ;;
            skill) echo "path=.github/ISSUE_TEMPLATE/submit-skill.yml" >> "$GITHUB_OUTPUT" ;;
            mcp-server) echo "path=.github/ISSUE_TEMPLATE/submit-mcp-server.yml" >> "$GITHUB_OUTPUT" ;;
            plugin) echo "path=.github/ISSUE_TEMPLATE/submit-plugin.yml" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unrecognised type '$TYPE'"; exit 1 ;;
          esac

      # internal project documentation Section 6 names stefanbuck/github-issue-parser
      # specifically. Confirm its current major version tag against the
      # action's own releases before this workflow is first exercised
      # against a live repository (it has never run end-to-end here yet --
      # see internal project documentation Phase 4's verification notes).
      - name: Parse the issue body
        id: issue-parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: ${{ steps.template.outputs.path }}

      - name: Build and validate the candidate record
        id: validation
        env:
          ISSUE_TYPE: ${{ steps.type.outputs.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_FIELDS_JSON: ${{ steps.issue-parser.outputs.jsonString }}
        run: pnpm exec tsx scripts/validate-submission.ts > /tmp/result.json

      - name: Comment the result and update labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/result.json', 'utf-8'));
            const issue_number = context.issue.number;

            async function removeLabelIfPresent(name) {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            if (result.ok) {
              const body = [
                '✅ This submission passed automated validation.',
                '',
                '<details><summary>Rendered preview of the entry that would be published</summary>',
                '',
                '```json',
                JSON.stringify(result.record, null, 2),
                '```',
                '</details>',
                '',
                'A registry maintainer will review this next. Automation does not decide whether this entry belongs in the catalogue; a human does (internal project documentation Section 5.4).',
              ].join('\n');
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['ready-for-review'] });
              await removeLabelIfPresent('needs-changes');
            } else {
              const errorLines = result.parseErrors.length > 0
                ? result.parseErrors.map((e) => `- ${e}`)
                : (result.validation?.issues ?? [])
                    .filter((i) => i.severity === 'error')
                    .map((i) => `- \`${i.code}\`${i.path ? ` (\`${i.path}\`)` : ''}: ${i.message}`);
              const body = [
                '❌ This submission did not pass automated validation:',
                '',
                ...(errorLines.length > 0 ? errorLines : ['- An unspecified validation error occurred; see the workflow run log.']),
                '',
                'Please edit this issue to fix the problem(s) above. This check re-runs automatically on every edit.',
              ].join('\n');
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['needs-changes'] });
              await removeLabelIfPresent('ready-for-review');
            }
