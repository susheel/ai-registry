# GitLab CI build and non-canonical GitLab Pages copy (internal project documentation).
#
# NOT the live deploy path. The canonical site, https://registry.biocommons.ai,
# is served by GitHub Pages from github.com/susheel/ai-registry, built and
# deployed by `.github/workflows/deploy.yml` on every push to `main`
# (verified 2026-09-30: DNS CNAME registry.biocommons.ai -> susheel.github.io;
# the GitHub Pages API reports cname registry.biocommons.ai, build_type
# "workflow", HTTPS enforced; the Deploy run for f0f26cf succeeded and the
# site returns 200).
#
# This GitLab project (gitlab.com/susheel/ai-registry, private) is the
# full-content mirror, pushed by hand; GitHub carries a filtered public
# history (internal project documentation). The jobs below
# are kept as a secondary CI signal: `build` runs the same validate and build
# steps as deploy.yml, and `pages` publishes a non-canonical copy at GitLab's
# unique Pages domain (https://ai-registry-c331e8.gitlab.io as of 2026-09-30).
# No custom domain points at it. Kept because it is harmless and gives an
# independent build check; delete the `pages` job if the extra public copy
# ever causes confusion.
#
# History: from 2026-09-08 to 2026-09-11 (internal project documentation Phase 12 addendum)
# GitLab Pages briefly was the live target while the GitHub repository was
# private. That arrangement ended on 2026-09-11 when the GitHub repository was
# made public and GitHub Pages took over; this header said otherwise until
# the 2026-09-30 correction.

image: node:22-slim

stages:
  - build
  - pages

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

.pnpm-setup:
  before_script:
    - corepack enable
    # No explicit pnpm version pin here: corepack reads it from package.json's
    # own `packageManager` field, matching the same discipline
    # `.github/workflows/deploy.yml`'s comment records (a hard-coded version
    # elsewhere previously conflicted with that field and broke CI outright).
    - corepack prepare --activate
    - pnpm config set store-dir $PNPM_HOME
    - pnpm install --frozen-lockfile

build:
  extends: .pnpm-setup
  stage: build
  script:
    # --skip-network: the 18 pre-existing ga4gh-* entries per type
    # (skills/mcp-servers/plugins) reference github.com/susheel/ga4gh-plugins,
    # kept deliberately private (internal project documentation Phase 9) -- an unauthenticated
    # reachability check against a private repo 404s permanently, not
    # transiently. Schema, licence, category, and slug-collision checks still
    # run and still fail this job; only live URL reachability is skipped.
    - pnpm run validate -- --skip-network
    - pnpm --filter site build
    - pnpm run build:index -- --out-dir site/dist
    - pnpm run build:ai-catalog -- --out-dir site/dist
    - pnpm run build:mcp-docs -- --out-dir site/dist
    - pnpm run build:marketplace -- --out-dir site/dist
  artifacts:
    paths:
      - site/dist
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: pages
  needs:
    - build
  script:
    - mv site/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
